name: smc-scan
on:
  schedule:
    - cron: '0 7,12,16,20 * * *'
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smc-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scan.py
        env:
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
